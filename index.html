<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salerno Recipes">
<title>Salerno Recipes</title>
<style>
:root{
  --bg:#f5f6f2;--card:#ffffff;--ink:#1d2623;--mute:#68746f;--line:#dfe3dc;--accent:#1f5c66;--chip:#e9ede7;--onaccent:#ffffff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121819;--card:#1b2324;--ink:#ecf0ec;--mute:#93a09b;--line:#2b3535;--accent:#78bcc7;--chip:#232d2e;--onaccent:#0f1a1c}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(40px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
h1,h2,.title{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.site{font-size:32px;padding:26px 0 14px}
.top{display:flex;align-items:center;justify-content:space-between}
.tools{display:flex;flex:none}
.refresh{flex:none;width:44px;height:44px;margin-top:12px;border:0;background:none;color:var(--accent);font-size:26px;line-height:1;cursor:pointer}
.refresh svg{width:24px;height:24px;vertical-align:middle;pointer-events:none}
input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=search]{padding-right:44px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search{position:relative}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:20px;line-height:1;cursor:pointer}
.clear[hidden]{display:none}
.count{color:var(--mute);font-size:14px;margin:0 2px 10px}
input[type=search]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:15px;padding:7px 14px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);cursor:pointer}
.selrow{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 0}
.selrow:empty{display:none;padding:0}
.chip.ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--onaccent)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.open{flex:1;min-width:0;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:14px 4px 14px 16px;cursor:pointer}
.open .title{font-size:20px;display:block}
.open small{color:var(--mute);font-size:14px}
.heart{flex:none;width:48px;height:48px;border:0;background:none;font-size:24px;line-height:1;color:var(--mute);cursor:pointer}
.heart[aria-pressed=true]{color:var(--accent)}
.empty{color:var(--mute);padding:28px 4px;text-align:center}
.back{font:inherit;color:var(--accent);background:none;border:0;padding:20px 0 6px;cursor:pointer}
.rtitle{font-size:30px;line-height:1.15;padding:6px 0 4px}
.cats{color:var(--mute);font-size:15px;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.btn{font:inherit;font-size:16px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
h2{font-size:22px;margin:26px 0 8px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{padding:9px 0;border-bottom:1px solid var(--line)}
ol.steps{margin:0;padding-left:22px}
ol.steps li{padding:6px 0 6px 4px}
.note{background:var(--chip);border-radius:12px;padding:12px 14px;margin-top:22px}
.src{margin-top:22px}
.src a{color:var(--accent)}
label{display:block;font-weight:600;margin:18px 0 6px}
textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:120px}
.hint{color:var(--mute);font-size:14px;margin:4px 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.bar p{margin:0 0 6px;font-size:15px;color:var(--mute)}
.bar .actions{margin:0}
.row.off{opacity:.5}
.tog{flex:none;margin-right:12px;font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--accent);cursor:pointer}
.heart.x{font-size:18px}
.btn:disabled{opacity:.5;cursor:default}
.wheelbtn{display:block;width:100%;margin-top:10px;text-align:center}
.wheelbox{position:relative;width:min(100%,340px);margin:20px auto 6px}
.wheelbox canvas{display:block;width:100%;height:auto;border-radius:50%;box-shadow:0 2px 12px rgba(0,0,0,.2);will-change:transform}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--ink);z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px;text-align:center}
.result small{color:var(--mute);font-size:14px}
.result .title{display:block;font-size:24px;line-height:1.2;margin:4px 0 2px}
.result .actions{justify-content:center}
.spin{display:block;width:100%;margin-top:14px;font-size:18px;padding:14px}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.chip.out{background:none;border:1px solid var(--line);color:var(--mute);text-decoration:line-through}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Adam's phone number for the "Send update" text, e.g. "+14145551234". Leave blank to pick the contact in Messages.
const PHONE = "";
// Order the category chips appear in. Any other category shows up after these.
const ORDER = ["Beef","Chicken","Pork","Seafood","Pasta","Sides","Soups","Desserts","Breakfast","Drinks","Crockpot","Air Fryer"];
// Categories left off the recipe wheel until you turn them on (the choice is remembered on each phone).
const WHEEL_DEFAULT_OUT = ["Desserts","Drinks"];
// How many recipes are drawn on the wheel at once.
const WHEEL_SLICES = 10;


// Never render inside someone else's frame (clickjacking).
if (window.top !== window.self) document.documentElement.style.display = "none";
const app = document.getElementById("app");
let recipes = [], sel = new Set(), query = "", editing = false, loaded = false, failed = false;
let spinning = false, spinTimer = 0, wheelState = null, backTo = "", dessertsOnly = false;
let wheelOut = new Set(WHEEL_DEFAULT_OUT);
try { const w = JSON.parse(localStorage.getItem("wheelOut2")); if (Array.isArray(w)) wheelOut = new Set(w.filter(x => typeof x === "string")); } catch (e) {}
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("favs") || "[]")); } catch (e) {}
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem("hidden") || "[]")); } catch (e) {}


let draft = null;
try { draft = JSON.parse(localStorage.getItem("draft") || "null"); } catch (e) {}
const saveUI = () => { try { localStorage.setItem("ui", JSON.stringify({ q: query, sel: [...sel], editing, hash: location.hash, t: Date.now() })); } catch (e) {} };
const STALE_MS = 6 * 60 * 60 * 1000; // after this long away, start fresh on the home list
const saveDraft = () => {
  const g = id => document.getElementById(id);
  if (!editing || !g("e-ing")) return;
  draft = { id: currentId(), ing: g("e-ing").value, steps: g("e-steps").value, notes: g("e-notes").value };
  try { localStorage.setItem("draft", JSON.stringify(draft)); } catch (e) {}
};
const clearDraft = () => { draft = null; try { localStorage.removeItem("draft"); } catch (e) {} };
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const saveFavs = () => { try { localStorage.setItem("favs", JSON.stringify([...favs])); } catch (e) {} };
const saveHidden = () => { try { localStorage.setItem("hidden", JSON.stringify([...hidden])); } catch (e) {} };
const currentId = () => { if (!location.hash.startsWith("#r/")) return null; try { return decodeURIComponent(location.hash.slice(3)); } catch (e) { return null; } };
const saveWheelOut = () => { try { localStorage.setItem("wheelOut2", JSON.stringify([...wheelOut])); } catch (e) {} };

// Only http(s) links are ever allowed (blocks javascript:, data:, etc.).
function safeUrl(s) {
  s = String(s || "").trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) { if (/^[a-z][a-z0-9+.-]*:(?!\d)/i.test(s)) return null; s = "https://" + s; }
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}

// Treat recipes.json (and the cached copy) as untrusted: keep only the fields the site uses, with the right types.
const str = v => typeof v === "string" ? v : "";
const strs = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
function clean(data) {
  if (!Array.isArray(data)) throw new Error("bad recipe data");
  return data.filter(r => r && typeof r === "object" && typeof r.id === "string" && r.id && typeof r.title === "string")
    .map(r => ({ id: r.id, title: r.title, categories: strs(r.categories), ingredients: strs(r.ingredients), steps: strs(r.steps), notes: str(r.notes), source: str(r.source) }));
}

// Unbiased random integer in [0, n).
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function shuffled(list) { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }


function categoriesInUse(list) {
  const used = new Set(list.flatMap(r => r.categories || []));
  const known = ORDER.filter(c => used.has(c));
  const extra = [...used].filter(c => !ORDER.includes(c)).sort();
  return [...known, ...extra];
}


function renderList() {
  backTo = "";
  document.title = "Salerno Recipes";
  const hiddenList = recipes.filter(r => hidden.has(r.id));
  const showHidden = sel.has("Hidden");
  const pool = showHidden ? hiddenList : recipes.filter(r => !hidden.has(r.id));
  const chips = (favs.size ? ["Favorites"] : []).concat(categoriesInUse(recipes), hiddenList.length ? ["Hidden"] : []);
  if (loaded) [...sel].forEach(c => { if (!chips.includes(c)) sel.delete(c); });
  // Every word must match somewhere (any order); a trailing "s" is ignored so "sliders" finds "slider".
  const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean).map(t => t.length > 3 && /[^s]s$/.test(t) ? t.slice(0, -1) : t);
  const shown = pool.filter(r => {
    if (sel.has("Favorites") && !favs.has(r.id)) return false;
    for (const c of sel) if (c !== "Favorites" && c !== "Hidden" && !(r.categories || []).includes(c)) return false;
    if (!terms.length) return true;
    const hay = [r.title, ...(r.categories || []), ...(r.ingredients || [])].join(" ").toLowerCase();
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }));
  let body;
  if (failed) body = '<p class="empty">The recipes could not be loaded. Check your connection and reload.</p>';
  else if (!loaded) body = '<p class="empty">Loading recipes…</p>';
  else if (!shown.length) body = '<p class="empty">No recipes match. Try a different search or category.</p>';
  else body = '<p class="count">' + (shown.length === pool.length ? pool.length : shown.length + " of " + pool.length) + (pool.length === 1 ? " recipe" : " recipes") + '</p><div class="list">' + shown.map(r => {
    const id = esc(r.id), t = esc(r.title);
    const main = `<button class="open" data-open="${id}"><span class="title">${t}</span><small>${esc((r.categories || []).join(", "))}</small></button>`;
    if (showHidden) return `<div class="row off">${main}<button class="tog" data-hide="${id}">Restore</button></div>`;
    return `<div class="row">${main}<button class="heart" data-fav="${id}" aria-pressed="${favs.has(r.id)}" aria-label="Favorite ${t}">${favs.has(r.id) ? "♥" : "♡"}</button><button class="heart x" data-hide="${id}" aria-label="Hide ${t}">✕</button></div>`;
  }).join("") + "</div>";
  // Keep the search box (and keyboard) alive while typing: only rebuild it when missing.
  if (!document.getElementById("q")) {
    app.innerHTML = '<div class="top"><h1 class="site">Salerno Recipes</h1><div class="tools"><button class="refresh" data-a="share" aria-label="Share this site">'+SHARE_ICON+'</button><button class="refresh" data-a="refresh" aria-label="Refresh">↻</button></div></div><div class="search"><input id="q" type="search" placeholder="Search recipes or ingredients" aria-label="Search" autocomplete="off"><button type="button" class="clear" id="clr" data-a="clearq" aria-label="Clear search" hidden>✕</button></div><button type="button" class="btn wheelbtn" data-a="wheel">🎡 Spin the wheel to pick a recipe</button><button type="button" class="btn wheelbtn" data-a="food">🥡 Spin the wheel for takeout</button><div class="selrow" id="selrow"></div><div class="chips" id="chips"></div><div id="bar"></div><div id="results"></div>';
    document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderList(); });
  }
  document.getElementById("q").value = query;
  document.getElementById("clr").hidden = !query;
  const labelFor = c => c === "Favorites" ? "♥ Favorites" : c === "Hidden" ? "Hidden (" + hiddenList.length + ")" : esc(c);
  document.getElementById("selrow").innerHTML = sel.size
    ? [...sel].map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="true" aria-label="Remove filter ${esc(c)}">${labelFor(c)} ✕</button>`).join("") + (sel.size > 1 ? '<button class="chip ghost" data-cat="All">Clear all</button>' : "")
    : "";
  document.getElementById("chips").innerHTML = ["All"].concat(chips).map(c => {
    const on = c === "All" ? sel.size === 0 : sel.has(c);
    const label = labelFor(c);
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${on}">${label}</button>`;
  }).join("");
  document.getElementById("bar").innerHTML = showHidden ? `<div class="bar"><p>${hiddenList.length} hidden. Restore any you want to keep, then text the rest to Adam.</p><div class="actions"><button class="btn primary" data-a="sendhidden">Text hidden list to Adam</button><button class="btn" data-a="unhideall">Restore all</button></div></div>` : "";
  document.getElementById("results").innerHTML = body;
  saveUI();
}


function renderRecipe(r) {
  document.title = r.title + " | Salerno Recipes";
  const f = favs.has(r.id);
  const url = safeUrl(r.source);
  if (editing) {
    const d = draft && draft.id === r.id ? draft : null;
    app.innerHTML = `
      <button class="back" data-a="cancel">‹ Cancel</button>
      <h1 class="rtitle">Edit ${esc(r.title)}</h1>
      <label for="e-ing">Ingredients</label>
      <textarea id="e-ing" rows="10">${esc(d ? d.ing : (r.ingredients || []).join("\n"))}</textarea>
      <p class="hint">One ingredient per line.</p>
      <label for="e-steps">Steps</label>
      <textarea id="e-steps" rows="12">${esc(d ? d.steps : (r.steps || []).join("\n"))}</textarea>
      <p class="hint">One step per line, no numbers needed.</p>
      <label for="e-notes">Notes</label>
      <textarea id="e-notes" rows="3">${esc(d ? d.notes : (r.notes || ""))}</textarea>
      <div class="actions"><button class="btn primary" data-a="send">Text update to Adam</button></div>
      <p class="hint">This opens Messages with your changes filled in. Tap send there.</p>`;
    return;
  }
  app.innerHTML = `
    <div class="top"><button class="back" data-a="back">‹ All recipes</button><button class="refresh" data-a="share" aria-label="Share this recipe">${SHARE_ICON}</button></div>
    <h1 class="rtitle">${esc(r.title)}</h1>
    <div class="cats">${esc((r.categories || []).join(", "))}</div>
    <div class="actions">
      <button class="btn" data-a="fav" aria-pressed="${f}">${f ? "♥ Favorite" : "♡ Favorite"}</button>
      <button class="btn" data-a="copy">Copy ingredients</button>
      <button class="btn" data-a="edit">Edit</button>
      <button class="btn" data-a="hide">${hidden.has(r.id) ? "Restore" : "Hide"}</button>
    </div>
    <h2>Ingredients</h2>
    <ul class="ing">${(r.ingredients || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <h2>Steps</h2>
    <ol class="steps">${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${r.notes ? `<div class="note">${esc(r.notes)}</div>` : ""}
    ${url ? `<p class="src"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">View the original</a></p>` : ""}`;
}


function render() {
  const onWheel = location.hash === "#wheel", onFood = location.hash === "#food";
  if ((onWheel || onFood) && spinning) return; // let the spin finish; background refreshes shouldn't interrupt it
  clearTimeout(spinTimer); spinning = false;
  if (onWheel) { editing = false; renderWheel(); return; }
  if (onFood) { editing = false; renderFood(); return; }
  const id = currentId();
  const r = id && recipes.find(x => x.id === id);
  if (r) { renderRecipe(r); saveUI(); } else { if (loaded) editing = false; if (id && loaded) location.hash = ""; renderList(); }
}


// ---------- Recipe wheel ----------
const wheelPool = () => recipes.filter(r => !hidden.has(r.id) && (dessertsOnly
  ? (r.categories || []).includes("Desserts")
  : !(r.categories || []).some(c => wheelOut.has(c))));
const recipeMap = () => new Map(recipes.map(r => [r.id, r]));
function newSegs(pool, avoid) {
  const others = pool.filter(r => r.id !== avoid);
  return shuffled(others.length ? others : pool).slice(0, WHEEL_SLICES).map(r => r.id);
}
// A different set of slices: prefer recipes that weren't on the wheel last time.
function freshSegs(pool, prev) {
  const old = new Set(prev), fresh = shuffled(pool.filter(r => !old.has(r.id))), rest = shuffled(pool.filter(r => old.has(r.id)));
  return fresh.concat(rest).slice(0, WHEEL_SLICES).map(r => r.id);
}
function reshuffle() {
  if (spinning) return;
  const pool = wheelPool();
  if (!pool.length || !wheelState) return;
  wheelState = { segs: freshSegs(pool, wheelState.segs), rot: 0, winner: null };
  renderWheel();
}
function fitText(ctx, s, max) {
  if (ctx.measureText(s).width <= max) return s;
  while (s.length > 1 && ctx.measureText(s + "…").width > max) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}
function drawWheel(cv, titles, fs = 30, mw = .66) {
  const ctx = cv.getContext("2d"), S = cv.width, c = S / 2, R = c - 8, n = titles.length, a = Math.PI * 2 / n;
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  const pal = [[v("--accent"), v("--onaccent")], [v("--chip"), v("--ink")], [v("--line"), v("--ink")]];
  ctx.clearRect(0, 0, S, S);
  for (let i = 0; i < n; i++) {
    const p = pal[n > 1 && n % 2 && i === n - 1 ? 2 : i % 2];
    const st = -Math.PI / 2 + i * a;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, st, st + a); ctx.closePath();
    ctx.fillStyle = p[0]; ctx.fill();
    if (n > 1) { ctx.strokeStyle = v("--card"); ctx.lineWidth = 3; ctx.stroke(); }
    ctx.save(); ctx.translate(c, c); ctx.rotate(st + a / 2);
    ctx.fillStyle = p[1]; ctx.font = '600 ' + fs + 'px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(fitText(ctx, titles[i], R * mw), R - 24, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = v("--line"); ctx.stroke();
  ctx.beginPath(); ctx.arc(c, c, 30, 0, Math.PI * 2); ctx.fillStyle = v("--card"); ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
}
const resultHTML = r => `<div class="result"><small>Your pick</small><span class="title">${esc(r.title)}</span><small>${esc((r.categories || []).join(", "))}</small><div class="actions"><button class="btn primary" data-a="viewpick">View recipe</button></div></div>`;

function renderWheel() {
  backTo = "";
  document.title = "Recipe wheel | Salerno Recipes";
  if (!loaded) {
    app.innerHTML = `<button class="back" data-a="back">‹ All recipes</button><p class="empty">${failed ? "The recipes could not be loaded. Check your connection and reload." : "Loading recipes…"}</p>`;
    return;
  }
  const pool = wheelPool(), ids = new Set(pool.map(r => r.id)), byId = recipeMap();
  if (wheelState && (!wheelState.segs.length || !wheelState.segs.every(id => ids.has(id)) || (wheelState.winner && !ids.has(wheelState.winner)))) wheelState = null;
  if (!wheelState && pool.length) wheelState = { segs: newSegs(pool, null), rot: 0, winner: null };
  const chips = categoriesInUse(recipes.filter(r => !hidden.has(r.id))).map(c => {
    const on = !wheelOut.has(c);
    return `<button class="chip${on ? "" : " out"}" data-wcat="${esc(c)}" aria-pressed="${on}" aria-label="${esc(c)}: ${on ? "on the wheel" : "left out"}">${esc(c)}</button>`;
  }).join("");
  const winner = wheelState && wheelState.winner ? byId.get(wheelState.winner) : null;
  app.innerHTML = `
    <div class="top"><button class="back" data-a="back">‹ All recipes</button></div>
    <h1 class="rtitle">Spin the wheel</h1>
    <div class="wchips"><button class="chip" data-wmode="meals" aria-pressed="${!dessertsOnly}">Meals</button><button class="chip" data-wmode="desserts" aria-pressed="${dessertsOnly}">Desserts only</button></div>
    ${pool.length
      ? `<div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="720" height="720" role="img" aria-label="Recipe wheel"></canvas></div>`
      : `<p class="empty">${dessertsOnly ? "No dessert recipes yet." : "Nothing is left on the wheel. Tap a category below to put it back."}</p>`}
    <div id="wres" aria-live="polite">${winner ? resultHTML(winner) : ""}</div>
    <button class="btn primary spin" id="spinbtn" data-a="spin"${pool.length ? "" : " disabled"}>${winner ? "Spin again" : "Spin the wheel"}</button>
    <button class="btn wheelbtn" id="shufbtn" data-a="reshuffle"${pool.length ? "" : " disabled"}>↻ Shuffle the ${WHEEL_SLICES} picks</button>
    ${dessertsOnly
      ? `<p class="hint" style="margin-top:16px">Showing only recipes in Desserts. Switch to Meals to pick categories.</p>`
      : `<h2>On the wheel</h2><p class="hint">Tap a category to leave it out or put it back. Hidden recipes are never included.</p><div class="wchips" style="margin-top:12px">${chips}</div>`}
    <p class="count" style="margin-top:12px">${pool.length} ${pool.length === 1 ? "recipe" : "recipes"} in the mix</p>`;
  if (pool.length) {
    const cv = document.getElementById("wheel");
    drawWheel(cv, wheelState.segs.map(id => byId.get(id).title));
    cv.style.transform = `rotate(${wheelState.rot}deg)`;
  }
  saveUI();
}

function spin() {
  if (spinning) return;
  const pool = wheelPool(), cv = document.getElementById("wheel");
  if (!pool.length || !cv || !wheelState) return;
  const byId = recipeMap();
  if (wheelState.winner) { // spinning again: draw a fresh set of recipes
    wheelState = { segs: newSegs(pool, wheelState.winner), rot: 0, winner: null };
    drawWheel(cv, wheelState.segs.map(id => byId.get(id).title));
  }
  const n = wheelState.segs.length, size = 360 / n, i = rnd(n), winnerId = wheelState.segs[i];
  const landAt = (i + .5) * size + (Math.random() - .5) * size * .7; // somewhere inside the winning slice
  const target = 360 * 5 + (((360 - landAt) % 360) + 360) % 360;
  const dur = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? 600 : 4500;
  cv.style.transition = "none"; cv.style.transform = "rotate(0deg)"; void cv.offsetWidth;
  cv.style.transition = "transform " + dur + "ms cubic-bezier(.12,.7,.1,1)"; cv.style.transform = `rotate(${target}deg)`;
  wheelState.rot = target; wheelState.winner = winnerId;
  document.getElementById("wres").innerHTML = "";
  const btn = document.getElementById("spinbtn"); btn.disabled = true;
  document.getElementById("shufbtn").disabled = true;
  spinning = true;
  spinTimer = setTimeout(() => {
    spinning = false;
    const res = document.getElementById("wres"), b = document.getElementById("spinbtn");
    if (!res || !b) return;
    res.innerHTML = resultHTML(byId.get(winnerId));
    b.disabled = false; b.textContent = "Spin again";
    const sb = document.getElementById("shufbtn"); if (sb) sb.disabled = false;
    res.scrollIntoView({ block: "nearest" });
  }, dur + 80);
}


// ---------- Takeout wheel ----------
// Edit this list to add or change restaurants. Each one has exactly one type.
const FOOD = [
  ["Chick-fil-A","Chicken"],["Culver's","Burgers"],["McDonald's","Burgers"],
  ["Little Cancun","Mexican"],["Bel Air Cantina","Mexican"],["Qdoba","Mexican"],
  ["Panda Gourmet","Chinese"],["Panda Express","Chinese"],
  ["Domino's","Pizza"],["Papa John's","Pizza"],
  ["Cousins","Sandwiches"],["Jimmy John's","Sandwiches"],["Buona","Sandwiches"],["Panera Bread","Sandwiches"],["Arby's","Sandwiches"],
  ["Texas Roadhouse","Steak"],["Noodles & Co","Noodles"]
].map(([name, type]) => ({ name, type }));
const FOOD_TYPES = [...new Set(FOOD.map(f => f.type))];
let foodOut = new Set(), foodState = null;
try { const w = JSON.parse(localStorage.getItem("foodOut")); if (Array.isArray(w)) foodOut = new Set(w.filter(x => FOOD.some(f => f.name === x))); } catch (e) {}
const saveFoodOut = () => { try { localStorage.setItem("foodOut", JSON.stringify([...foodOut])); } catch (e) {} };
const foodPool = () => FOOD.filter(f => !foodOut.has(f.name));
const foodResultHTML = f => `<div class="result"><small>Tonight's pick</small><span class="title">${esc(f.name)}</span><small>${esc(f.type)}</small><div class="actions"><a class="btn primary" href="https://maps.apple.com/?q=${encodeURIComponent(f.name)}" target="_blank" rel="noopener noreferrer">Find nearby</a></div></div>`;

function renderFood() {
  backTo = "";
  document.title = "Takeout wheel | Salerno Recipes";
  const pool = foodPool(), byName = new Map(FOOD.map(f => [f.name, f]));
  if (foodState && (foodState.segs.length !== pool.length || !foodState.segs.every(n => byName.has(n) && !foodOut.has(n)))) foodState = null;
  if (!foodState && pool.length) foodState = { segs: shuffled(pool).map(f => f.name), rot: 0, winner: null };
  const winner = foodState && foodState.winner ? byName.get(foodState.winner) : null;
  const tchips = FOOD_TYPES.map(t => {
    const on = FOOD.some(f => f.type === t && !foodOut.has(f.name));
    return `<button class="chip${on ? "" : " out"}" data-ft="${esc(t)}" aria-pressed="${on}" aria-label="${esc(t)}: ${on ? "on the wheel" : "left out"}">${esc(t)}</button>`;
  }).join("");
  const rchips = FOOD.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" })).map(f => {
    const on = !foodOut.has(f.name);
    return `<button class="chip${on ? "" : " out"}" data-fr="${esc(f.name)}" aria-pressed="${on}" aria-label="${esc(f.name)}: ${on ? "on the wheel" : "left out"}">${esc(f.name)}</button>`;
  }).join("");
  app.innerHTML = `
    <div class="top"><button class="back" data-a="back">‹ All recipes</button></div>
    <h1 class="rtitle">Takeout wheel</h1>
    ${pool.length
      ? `<div class="wheelbox"><div class="ptr"></div><canvas id="fwheel" width="720" height="720" role="img" aria-label="Restaurant wheel"></canvas></div>`
      : `<p class="empty">Nothing is left on the wheel. Tap a restaurant or type below to put it back.</p>`}
    <div id="fres" aria-live="polite">${winner ? foodResultHTML(winner) : ""}</div>
    <button class="btn primary spin" id="fspinbtn" data-a="fspin"${pool.length ? "" : " disabled"}>${winner ? "Spin again" : "Spin the wheel"}</button>
    <h2>Types of food</h2><p class="hint">Tap a type to leave all of it out or put it back.</p><div class="wchips" style="margin-top:12px">${tchips}</div>
    <h2>Restaurants</h2><p class="hint">Tap a restaurant to leave it out or put it back.</p><div class="wchips" style="margin-top:12px">${rchips}</div>
    <div class="actions" style="margin-top:14px"><button class="btn" data-a="fall">Put everything back</button><button class="btn" data-a="fnone">Leave everything out</button></div>
    <p class="count" style="margin-top:12px">${pool.length} ${pool.length === 1 ? "restaurant" : "restaurants"} in the mix</p>`;
  if (pool.length) {
    const cv = document.getElementById("fwheel");
    drawWheel(cv, foodState.segs, pool.length > 12 ? 27 : 30, .72);
    cv.style.transform = `rotate(${foodState.rot}deg)`;
  }
  saveUI();
}

function spinFood() {
  if (spinning) return;
  const cv = document.getElementById("fwheel");
  if (!cv || !foodState || !foodState.segs.length) return;
  const byName = new Map(FOOD.map(f => [f.name, f]));
  const n = foodState.segs.length, size = 360 / n, i = rnd(n), winnerName = foodState.segs[i];
  const landAt = (i + .5) * size + (Math.random() - .5) * size * .7;
  const target = 360 * 5 + (((360 - landAt) % 360) + 360) % 360;
  const dur = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? 600 : 4500;
  cv.style.transition = "none"; cv.style.transform = "rotate(0deg)"; void cv.offsetWidth;
  cv.style.transition = "transform " + dur + "ms cubic-bezier(.12,.7,.1,1)"; cv.style.transform = `rotate(${target}deg)`;
  foodState.rot = target; foodState.winner = winnerName;
  document.getElementById("fres").innerHTML = "";
  document.getElementById("fspinbtn").disabled = true;
  spinning = true;
  spinTimer = setTimeout(() => {
    spinning = false;
    const res = document.getElementById("fres"), b = document.getElementById("fspinbtn");
    if (!res || !b) return;
    res.innerHTML = foodResultHTML(byName.get(winnerName));
    b.disabled = false; b.textContent = "Spin again";
    res.scrollIntoView({ block: "nearest" });
  }, dur + 80);
}


// Opens the native share sheet (Messages, Mail, AirDrop, etc.). Falls back to copying the link.
async function share(r) {
  const base = location.origin + location.pathname;
  const data = r
    ? { title: r.title, text: r.title, url: base + "#r/" + encodeURIComponent(r.id) }
    : { title: "Salerno Recipes", text: "Salerno Recipes", url: base };
  if (navigator.share) {
    try { await navigator.share(data); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(data.url); alert("Link copied."); }
  catch (e) { prompt("Copy this link:", data.url); }
}


function updateText(r) {
  const lines = v => v.split("\n").map(s => s.trim()).filter(Boolean);
  const ing = lines(document.getElementById("e-ing").value);
  const steps = lines(document.getElementById("e-steps").value);
  const notes = document.getElementById("e-notes").value.trim();
  return `Recipe update: ${r.title}\n\nIngredients\n${ing.join("\n")}\n\nSteps\n${steps.map((s, i) => `${i + 1}. ${s}`).join("\n")}` + (notes ? `\n\nNotes\n${notes}` : "");
}


app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.open) { location.hash = "#r/" + encodeURIComponent(t.dataset.open); return; }
  if (t.dataset.wmode) {
    if (spinning) return;
    dessertsOnly = t.dataset.wmode === "desserts"; wheelState = null; renderWheel(); return;
  }
  if (t.dataset.wcat) {
    if (spinning) return;
    const c = t.dataset.wcat; wheelOut.has(c) ? wheelOut.delete(c) : wheelOut.add(c);
    saveWheelOut(); wheelState = null; renderWheel(); return;
  }
  if (t.dataset.fr) {
    if (spinning) return;
    const n = t.dataset.fr; foodOut.has(n) ? foodOut.delete(n) : foodOut.add(n);
    saveFoodOut(); foodState = null; renderFood(); return;
  }
  if (t.dataset.ft) {
    if (spinning) return;
    const members = FOOD.filter(f => f.type === t.dataset.ft), anyOn = members.some(f => !foodOut.has(f.name));
    members.forEach(f => anyOn ? foodOut.add(f.name) : foodOut.delete(f.name));
    saveFoodOut(); foodState = null; renderFood(); return;
  }
  if (t.dataset.cat) { const c = t.dataset.cat; if (c === "All") sel.clear(); else if (sel.has(c)) sel.delete(c); else sel.add(c); renderList(); return; }
  if (t.dataset.hide) { const id = t.dataset.hide; hidden.has(id) ? hidden.delete(id) : hidden.add(id); saveHidden(); renderList(); return; }
  if (t.dataset.fav) { const id = t.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); renderList(); return; }
  const a = t.dataset.a, r = recipes.find(x => x.id === currentId());
  if (a === "clearq") { query = ""; renderList(); document.getElementById("q").focus(); }
  else if (a === "share") share(r || null);
  else if (a === "back") { const b = backTo; backTo = ""; location.hash = b; }
  else if (a === "wheel") location.hash = "#wheel";
  else if (a === "spin") spin();
  else if (a === "food") location.hash = "#food";
  else if (a === "fspin") spinFood();
  else if (a === "fall") { if (!spinning) { foodOut.clear(); saveFoodOut(); foodState = null; renderFood(); } }
  else if (a === "fnone") { if (!spinning) { FOOD.forEach(f => foodOut.add(f.name)); saveFoodOut(); foodState = null; renderFood(); } }
  else if (a === "reshuffle") reshuffle();
  else if (a === "viewpick") { if (wheelState && wheelState.winner && !spinning) { backTo = "#wheel"; location.hash = "#r/" + encodeURIComponent(wheelState.winner); } }
  else if (a === "unhideall") { hidden.clear(); saveHidden(); renderList(); }
  else if (a === "sendhidden") {
    const list = recipes.filter(x => hidden.has(x.id));
    if (!list.length) alert("No recipes are hidden yet.");
    else location.href = "sms:" + PHONE + "&body=" + encodeURIComponent(`Recipes to remove (${list.length}):\n` + list.map(x => `${x.id} | ${x.title}`).join("\n"));
  }
  else if (a === "hide" && r) { if (hidden.has(r.id)) { hidden.delete(r.id); saveHidden(); render(); } else { hidden.add(r.id); saveHidden(); location.hash = ""; } }
  else if (a === "fav" && r) { favs.has(r.id) ? favs.delete(r.id) : favs.add(r.id); saveFavs(); render(); }
  else if (a === "edit") { clearDraft(); editing = true; render(); window.scrollTo(0, 0); }
  else if (a === "cancel") { clearDraft(); editing = false; render(); }
  else if (a === "refresh") location.reload();
  else if (a === "send" && r) { const body = updateText(r); clearDraft(); location.href = "sms:" + PHONE + "&body=" + encodeURIComponent(body); }
  else if (a === "copy" && r) {
    const done = () => { t.textContent = "Copied"; setTimeout(() => { t.textContent = "Copy ingredients"; }, 1800); };
    const text = (r.ingredients || []).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => alert("Copy failed. Try again."));
    else alert("Copy is not available in this browser.");
  }
});


app.addEventListener("input", e => { if (e.target.id && e.target.id.startsWith("e-")) saveDraft(); });


let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); saveUI(); return; }
  if (hiddenAt && Date.now() - hiddenAt > STALE_MS && !editing) {
    query = ""; sel.clear(); hiddenAt = 0;
    if (location.hash) location.hash = ""; else render();
    window.scrollTo(0, 0);
  }
});
window.addEventListener("hashchange", () => { editing = false; render(); window.scrollTo(0, 0); });


// Restore where you were if the phone discarded the page while it was in the background.
try {
  const u = JSON.parse(localStorage.getItem("ui") || "null");
  if (u && !(u.t && Date.now() - u.t > STALE_MS)) {
    query = u.q || "";
    (u.sel || []).forEach(c => sel.add(c));
    if (!location.hash && typeof u.hash === "string" && /^#(wheel|food|r\/[^\s]*)$/.test(u.hash)) history.replaceState(null, "", u.hash);
    editing = !!u.editing && u.hash === location.hash;
  }
} catch (e) {}


// Show the last-known recipes instantly, then check for fresh ones in the background.
let cached = null;
try { cached = localStorage.getItem("recipesCache"); if (cached) { recipes = clean(JSON.parse(cached)); loaded = true; } } catch (e) { cached = null; }


fetch("recipes.json", { cache: "no-cache" })
  .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
  .then(data => {
    const wasLoaded = loaded, fresh = JSON.stringify(data);
    recipes = clean(data); loaded = true; failed = false;
    try { localStorage.setItem("recipesCache", fresh); } catch (e) {}
    if (!wasLoaded || (fresh !== cached && !editing)) render();
  })
  .catch(() => { if (!loaded) { failed = true; render(); } });
render();
</script>
